services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: resume, POSTGRES_PASSWORD: resume, POSTGRES_DB: resume }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U resume"], interval: 5s, retries: 10 }

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://resume:resume@db:5432/resume
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # Optional local LLM: `docker compose --profile ollama up`, then set LLM_PROVIDER=ollama, OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
